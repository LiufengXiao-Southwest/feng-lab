name: Daily Literature Update

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 09:00 北京时间 (UTC+8 = 01:00 UTC)
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest papers
        run: python scripts/fetch_papers.py

      - name: Commit and push if changed
        run: |
          git config user.name  "FENG LAB Bot"
          git config user.email "fenglab-bot@users.noreply.github.com"
          git add data/papers.json
          git diff --staged --quiet || \
            git commit -m "update: daily literature $(date +%Y-%m-%d)" && \
            git push

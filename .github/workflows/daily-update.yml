name: Daily Literature Update

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 北京时间 (UTC+8 → 01:00 UTC)
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Fetch latest papers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_papers.py

      - name: Generate daily deep read
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_deep_read.py

      - name: Commit and push if changed
        run: |
          git config user.name  "FENG LAB Bot"
          git config user.email "fenglab-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add data/papers.json data/deep_read.json data/deep_read_history.json data/deep_read_history_full.json
          git diff --staged --quiet || (
            git commit -m "update: daily literature & deep read $(date +%Y-%m-%d)" &&
            git push
          )

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/notify_feishu.py

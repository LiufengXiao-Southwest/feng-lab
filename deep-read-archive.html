<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精读存档 · FENG LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function(){ if(localStorage.getItem('feng-lab-theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); })();
  </script>
  <style>
    .dr-archive-layout {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .dr-archive-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .dr-archive-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 400;
      color: var(--text-main);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .dr-archive-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .dr-archive-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dr-archive-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      transition: box-shadow 0.22s, transform 0.22s;
      text-decoration: none;
    }

    .dr-archive-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    .dr-archive-meta { flex: 1; min-width: 0; }

    .dr-archive-badges {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .dr-archive-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .dr-archive-title-en {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.45;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dr-archive-title-zh {
      font-size: 0.84rem;
      color: var(--text-sub);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dr-archive-journal {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
      font-family: var(--font-serif);
    }

    .dr-archive-cta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      background: var(--primary);
      color: #fff;
      font-size: 0.78rem;
      font-family: var(--font-sans);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .dr-archive-cta:hover { background: #a87a54; }
    .dr-archive-cta svg { width: 12px; height: 12px; }

    .dr-archive-today {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(196,149,106,0.15), var(--shadow);
    }

    .dr-today-badge {
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .dr-archive-empty {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .dr-archive-layout { padding: 24px 16px 60px; }
      .dr-archive-card { flex-direction: column; align-items: flex-start; gap: 14px; }
      .dr-archive-cta { width: 100%; justify-content: center; }
      .dr-archive-title-en { white-space: normal; }
      .dr-archive-title-zh { white-space: normal; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-main">FENG LAB</span>
        <span class="logo-sub">运动科学研究室 · Sports Science Lab</span>
      </div>
      <div class="header-right">
        <a class="nav-link" href="deep-read.html">今日精读</a>
        <a class="nav-link" href="index.html">← 返回首页</a>
        <div class="header-divider"></div>
        <span class="update-label">精读存档</span>
        <span class="update-date">Deep Read Archive</span>
        <div class="header-divider"></div>
        <button class="theme-toggle" id="themeToggle" title="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="dr-archive-layout">
    <div class="dr-archive-header">
      <div class="dr-archive-title">精读存档 · Deep Read Archive</div>
      <div class="dr-archive-sub">每日 AI 精选高引文献，引导式双语拆解 · Daily AI-curated landmark paper breakdowns</div>
    </div>

    <div class="dr-archive-list" id="drArchiveList">
      <div class="dr-archive-empty">正在加载…</div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span>FENG LAB © 2026</span>
      <span>由 AI Agent 自动更新 · Auto-updated by AI Agent</span>
    </div>
  </footer>

  <script>
    const TODAY = new Date().toISOString().slice(0, 10);

    async function loadArchive() {
      const list = document.getElementById('drArchiveList');
      try {
        const base = location.pathname.replace(/\/[^/]*$/, '');
        const res = await fetch(base + '/data/deep_read_history_full.json');
        const data = await res.json();
        const entries = data.entries || [];

        if (!entries.length) {
          list.innerHTML = '<div class="dr-archive-empty">暂无存档记录，每日自动更新后将在此显示。</div>';
          return;
        }

        list.innerHTML = entries.map(e => buildCard(e)).join('');
      } catch (err) {
        list.innerHTML = '<div class="dr-archive-empty">加载失败，请刷新重试。</div>';
      }
    }

    function buildCard(e) {
      const isToday = e.date === TODAY;
      const todayBadge = isToday ? '<span class="dr-today-badge">今日</span>' : '';
      const oaBadge = e.is_open_access ? '<span class="oa-badge">Open Access</span>' : '';
      const ifBadge = e.impact_factor ? `<span class="if-badge">IF ${e.impact_factor}</span>` : '';
      const citBadge = (e.citation_count && e.citation_count > 0)
        ? `<span class="cit-badge">◈ ${e.citation_count}</span>` : '';

      const doiHref = e.doi
        ? (e.doi.startsWith('http') ? e.doi : `https://doi.org/${e.doi}`)
        : '';

      // Today links to deep-read.html; history links to DOI
      const ctaHref = isToday ? 'deep-read.html' : (doiHref || '#');
      const ctaLabel = isToday ? '进入精读' : '查看原文';
      const ctaTarget = isToday ? '' : ' target="_blank" rel="noopener"';

      return `
<a class="dr-archive-card${isToday ? ' dr-archive-today' : ''}" href="${ctaHref}"${ctaTarget}>
  <div class="dr-archive-meta">
    <div class="dr-archive-badges">
      ${todayBadge}
      ${oaBadge}
      ${ifBadge}
      ${citBadge}
      <span class="dr-archive-date">${e.date || ''}</span>
    </div>
    <div class="dr-archive-title-en">${e.title_en || ''}</div>
    <div class="dr-archive-title-zh">${e.title_zh || ''}</div>
    <div class="dr-archive-journal">${e.journal || ''} · ${e.year || ''} · ${e.authors || ''}</div>
  </div>
  <span class="dr-archive-cta">
    ${ctaLabel}
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 4 L10 8 L6 12"/>
    </svg>
  </span>
</a>`;
    }

    loadArchive();

    // Dark mode toggle
    const themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('feng-lab-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('feng-lab-theme', 'dark');
        }
      });
    }
  </script>
</body>
</html>

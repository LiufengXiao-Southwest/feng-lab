<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文献归档 · FENG LAB</title>
  <link rel="preload" href="assets/fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply saved theme before render to avoid flash. No stored value ⇒ CSS
    // falls back to prefers-color-scheme.
    (function(){ var t=localStorage.getItem('feng-lab-theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
  </script>
  <style>
    .archive-layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 32px 80px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 40px;
      align-items: start;
    }

    /* Sidebar */
    .archive-nav {
      position: sticky;
      top: 80px;
    }

    .archive-nav-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .archive-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .archive-nav-list button {
      display: block;
      width: 100%;
      border: 0;
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: left;
      font-family: var(--font-sans);
      background: transparent;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .archive-nav-list button:hover,
    .archive-nav-list button.active {
      background: var(--primary-light);
      color: var(--primary);
    }
    .archive-nav-list .nav-count {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    /* Main content */
    .archive-main {}

    .archive-controls {
      margin-bottom: 28px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .archive-date-input {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .archive-date-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(196,149,106,0.12);
    }
    .archive-day-btn {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--text-sub);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .archive-day-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Month group */
    .archive-group { margin-bottom: 36px; }

    .archive-day-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary-light);
    }

    .archive-day-label {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: var(--text-main);
    }

    .archive-day-count {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Paper row */
    .archive-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .archive-row:last-child { border-bottom: none; }
    .archive-row:hover { background: var(--row-hover-bg); border-radius: 8px; padding-left: 8px; }

    /* Row the visitor arrived at from a global search hit */
    .archive-row.archive-row-hit {
      background: var(--primary-light);
      border-radius: 8px;
      padding-left: 8px;
      box-shadow: inset 3px 0 0 var(--primary);
      scroll-margin-top: 100px;
    }

    .archive-row-tags {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 72px;
    }

    .archive-row-cat {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 100px;
    }
    .archive-row-cat.tag-biomechanics { background: var(--primary-light); color: var(--primary); }
    .archive-row-cat.tag-performance  { background: #EBF0F8; color: #4A6FA5; }
    .archive-row-cat.tag-supplements  { background: #EBF5EC; color: #3D7A45; }
    .archive-row-cat.tag-preprint     { background: #FDF3E7; color: #B06A1A; }

    .archive-row-oa {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 100px;
      background: #E6F4EA;
      color: #2E7D32;
      border: 1px solid #A5D6A7;
    }

    .archive-row-body { flex: 1; min-width: 0; }

    .archive-row-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 3px;
    }
    .archive-row-title-zh {
      font-size: 0.78rem;
      color: var(--text-sub);
      line-height: 1.4;
      margin-bottom: 5px;
    }
    .archive-row-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .archive-row-journal { font-style: italic; font-family: var(--font-serif); }

    .archive-row-actions {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .archive-empty {
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 48px 0;
      text-align: center;
    }

    @media (max-width: 768px) {
      .archive-layout {
        grid-template-columns: 1fr;
        padding: 20px 16px 60px;
        gap: 24px;
      }
      .archive-nav { position: static; display: none; }
      .archive-row { grid-template-columns: auto 1fr; }
      .archive-row-actions { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-main">FENG LAB</span>
        <span class="logo-sub">运动科学研究室 · Sports Science Lab</span>
      </div>
      <div class="header-right">
        <a class="nav-link" href="index.html">← 返回首页</a>
        <div class="header-divider"></div>
        <span class="update-label">文献归档</span>
        <span class="update-date">Archive</span>
        <div class="header-divider"></div>
        <button class="theme-toggle" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">
          <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="archive-layout">
    <!-- Sidebar nav -->
    <aside class="archive-nav">
      <div class="archive-nav-title">按日期跳转</div>
      <ul class="archive-nav-list" id="archiveNavList"></ul>
    </aside>

    <!-- Main -->
    <div class="archive-main">
      <div class="archive-controls">
        <button class="archive-day-btn" id="prevDayBtn">上一天</button>
        <input type="date" id="archiveDateInput" class="archive-date-input" />
        <button class="archive-day-btn" id="nextDayBtn">下一天</button>
      </div>
      <div id="archiveContent">
        <div class="loading">正在加载归档 / Loading archive…</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span>FENG LAB © 2026</span>
      <span>由 AI Agent 自动更新 · Auto-updated by AI Agent</span>
    </div>
  </footer>

  <script>
    const CAT = {
      biomechanics: { zh: '生物力学', cls: 'tag-biomechanics' },
      performance:  { zh: '运动表现', cls: 'tag-performance'  },
      supplements:  { zh: '运动补剂', cls: 'tag-supplements'  },
      preprint:     { zh: '预印本',   cls: 'tag-preprint'     },
    };

    let archiveDates = {};
    let sortedDates = [];
    let selectedDate = '';

    function buildRow(p) {
      const cat = CAT[p.category] || { zh: p.category, cls: '' };
      const doi = p.doi || '';
      const doiHref = doi.startsWith('http') ? doi : (doi ? `https://doi.org/${doi}` : '');
      const oaTag = p.is_open_access ? `<span class="archive-row-oa">OA</span>` : '';
      const ifTag = p.impact_factor ? `<span class="if-badge">IF ${p.impact_factor}</span>` : '';
      const citTag = (p.citation_count && p.citation_count > 0)
        ? `<span class="cit-badge">◈ ${p.citation_count}</span>` : '';
      const doiBtn = doiHref
        ? `<a class="btn-doi" href="${doiHref}" target="_blank" rel="noopener" style="font-size:0.7rem;padding:4px 10px">↗</a>`
        : '';
      const authors = (p.authors || []).slice(0, 3).join(', ') +
        ((p.authors || []).length > 3 ? ' et al.' : '');

      return `
<div class="archive-row" data-id="${p.id || ''}">
  <div class="archive-row-tags">
    <span class="archive-row-cat ${cat.cls}">${cat.zh}</span>
    ${oaTag}
  </div>
  <div class="archive-row-body">
    <div class="archive-row-title">${p.title_en || ''}</div>
    ${p.title_zh ? `<div class="archive-row-title-zh">${p.title_zh}</div>` : ''}
    <div class="archive-row-meta">
      <span class="archive-row-journal">${p.journal || ''}</span>
      <span>${p.year || ''}</span>
      <span>${authors}</span>
      ${ifTag}${citTag}
    </div>
  </div>
  <div class="archive-row-actions">${doiBtn}</div>
</div>`;
    }

    function getHashDate() {
      const params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      return params.get('date') || '';
    }

    // `#date=…&p=<paper id>` — set by a global search hit on the homepage
    function getHashPaper() {
      const params = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      return params.get('p') || '';
    }

    function highlightHashPaper() {
      const id = getHashPaper();
      if (!id) return;
      const row = document.querySelector(`.archive-row[data-id="${CSS.escape(id)}"]`);
      if (!row) return;
      row.classList.add('archive-row-hit');
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function setSelectedDate(date) {
      if (!archiveDates[date]) return;
      selectedDate = date;
      location.hash = `date=${date}`;
      renderArchive();
    }

    function renderArchive() {
      if (sortedDates.length === 0) {
        document.getElementById('archiveContent').innerHTML =
          '<div class="archive-empty">暂无文献 / No papers found.</div>';
        return;
      }

      document.getElementById('archiveNavList').innerHTML = sortedDates.map(date => `
        <li>
          <button type="button" class="${date === selectedDate ? 'active' : ''}" onclick="setSelectedDate('${date}')">
            ${date}
            <span class="nav-count">${(archiveDates[date] || []).length}</span>
          </button>
        </li>`).join('');

      const papers = archiveDates[selectedDate] || [];
      document.getElementById('archiveDateInput').value = selectedDate;
      document.getElementById('archiveContent').innerHTML = `
        <div class="archive-group">
          <div class="archive-day-header">
            <span class="archive-day-label">${selectedDate}</span>
            <span class="archive-day-count">${papers.length} 篇</span>
          </div>
          ${papers.length ? papers.map(buildRow).join('') : '<div class="archive-empty">该日期暂无文献</div>'}
        </div>`;

      const index = sortedDates.indexOf(selectedDate);
      document.getElementById('prevDayBtn').disabled = index >= sortedDates.length - 1;
      document.getElementById('nextDayBtn').disabled = index <= 0;

      highlightHashPaper();
    }

    async function loadArchive() {
      const base = location.pathname.replace(/\/[^/]*$/, '');
      const res  = await fetch(base + '/data/archive.json');
      const json = await res.json();
      archiveDates = json.dates || {};
      sortedDates = Object.keys(archiveDates).sort((a, b) => b.localeCompare(a));
      const hashDate = getHashDate();
      selectedDate = archiveDates[hashDate] ? hashDate : (sortedDates[0] || '');
      if (selectedDate && hashDate !== selectedDate) {
        history.replaceState(null, '', `#date=${selectedDate}`);
      }
      document.title = `文献归档 (${sortedDates.length}) · FENG LAB`;
      renderArchive();
    }

    document.getElementById('archiveDateInput').addEventListener('change', function() {
      setSelectedDate(this.value);
    });

    document.getElementById('prevDayBtn').addEventListener('click', () => {
      const index = sortedDates.indexOf(selectedDate);
      if (index >= 0 && index < sortedDates.length - 1) setSelectedDate(sortedDates[index + 1]);
    });

    document.getElementById('nextDayBtn').addEventListener('click', () => {
      const index = sortedDates.indexOf(selectedDate);
      if (index > 0) setSelectedDate(sortedDates[index - 1]);
    });

    window.addEventListener('hashchange', () => {
      const date = getHashDate();
      if (archiveDates[date]) {
        selectedDate = date;
        renderArchive();
      }
    });

    loadArchive();

    // Dark mode toggle — an explicit choice always beats the OS setting
    const themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const attr = document.documentElement.getAttribute('data-theme');
        const isDark = attr
          ? attr === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('feng-lab-theme', next);
      });
    }
  </script>
</body>
</html>

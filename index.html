<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FENG LAB — 每日科研简报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-main">FENG LAB</span>
        <span class="logo-sub">运动科学研究室 · Sports Science Lab</span>
      </div>
      <div class="header-right">
        <span class="update-label">最后更新 / Last updated</span>
        <span class="update-date" id="lastUpdated">—</span>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>每日科研简报</h1>
    <p>Daily Research Digest</p>
    <p class="hero-desc">生物力学 · 运动表现 · 运动补剂</p>
  </section>

  <!-- Deep Read Section -->
  <section class="deep-read-section" id="deepReadSection" style="display:none">
    <div class="dr-container">
      <div class="dr-section-header">
        <span class="dr-section-icon">◎</span>
        <div>
          <div class="dr-section-title">每日精读 · Daily Deep Read</div>
          <div class="dr-section-sub">引导式拆解经典高分文献 · Guided breakdown of landmark papers</div>
        </div>
      </div>

      <!-- Paper Info Bar -->
      <div class="dr-paper-bar" id="drPaperBar"></div>

      <!-- Analysis Grid -->
      <div class="dr-grid" id="drGrid"></div>
    </div>
  </section>

  <!-- Filter Bar -->
  <div class="filter-wrap">
    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">全部 / All</button>
      <button class="filter-btn" data-cat="biomechanics">生物力学 / Biomechanics</button>
      <button class="filter-btn" data-cat="performance">运动表现 / Performance</button>
      <button class="filter-btn" data-cat="supplements">运动补剂 / Supplements</button>
    </div>
    <div class="paper-count">
      <span id="paperCount">—</span> 篇文献
    </div>
  </div>

  <!-- Cards Grid -->
  <main class="container">
    <div class="grid" id="paperGrid">
      <div class="loading">正在加载文献 / Loading papers...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span>FENG LAB © 2026</span>
      <span>由 AI Agent 自动更新 · Auto-updated by AI Agent</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
